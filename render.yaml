services:
  - type: web
    name: prueba-2-api
    runtime: node
    plan: free
    rootDir: backend
    buildCommand: npm ci && npm run build
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: 24.21.0
      - key: CORS_ORIGIN
        sync: false # definir en el dashboard con la URL del frontend en Vercel
    # El plan free usa disco efímero: la BD SQLite se reinicia en cada deploy.
    # Con plan Starter, descomentar para persistir y añadir DATA_DIR=/var/data:
    # disk:
    #   name: data
    #   mountPath: /var/data
    #   sizeGB: 1
